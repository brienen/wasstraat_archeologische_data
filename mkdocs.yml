site_name: Wasstraat Archeologische Data
site_description: Technische documentatie voor de Wasstraat Archeologische Data - een open source verwerkingsplatform voor archeologische datasets
site_author: E-Space / Arjen Brienen
site_url: https://wasstraat.e-space.nl/
copyright: "© E-Space — Arjen Brienen. Uitgegeven onder de EUPL v1.2 licentie."

theme:
  name: readthedocs
  locale: nl
  custom_dir: overrides

nav:
  - Home: index.md
  - Aan de slag:
    - Handleiding (ontwikkelomgeving): aan-de-slag.md
    - Installatie met images: deployment/installatie-met-images.md
  - Configuratie: componenten/configuratie.md
  - Projectoverzicht:
    - Inleiding: overzicht/inleiding.md
    - Probleemstelling: overzicht/probleemstelling.md
    - Doelstellingen: overzicht/doelstellingen.md
  - Architectuur:
    - Systeemarchitectuur: architectuur/systeem.md
    - Verwerkingspipeline: architectuur/dataflow.md
    - Componentenmodel: architectuur/componenten.md
    - Gegevensmodel: architectuur/gegevensmodel.md
    - Technische stack: architectuur/stack.md
  - Componenten:
    - Extractie: componenten/extractie.md
    - MongoDB en Single_Store: componenten/singlestore.md
    - Transformatie: componenten/transformatie.md
    - Incrementeel laden: componenten/incrementeel-laden.md
    - Foutbeleid en verwerkingsrapport: componenten/verwerkingsrapport.md
    - Validatie en kwaliteitscontroles: componenten/validatie.md
    - Gemeenteprofielen: componenten/gemeenteprofielen.md
    - Zoeken en indexering: componenten/zoeken.md
  - Deployment:
    - Omgevingen en Docker Compose: deployment/omgevingen.md
    - Airflow en webapplicatie: deployment/airflow-vs-app.md
    - Voorbeelddata: deployment/voorbeelddata.md
    - Proefdata inlezen: deployment/proefdata.md
  - Testen: testen.md
  - Diagrammen: diagrammen.md
  - Toekomstvisie: toekomstvisie.md

# De generator van de diagrammen staat naast de SVG-bestanden, maar hoort niet in de site
exclude_docs: |
  assets/diagrams/*.py

# Dode links, onbekende ankers en pagina's buiten de navigatie zijn een waarschuwing,
# zodat 'mkdocs build --strict' ze laat falen
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite
  - tables
  - attr_list
  - md_in_html

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/lightbox.js
