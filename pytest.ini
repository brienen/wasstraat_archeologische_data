[pytest]
testpaths = tests
pythonpath = airflow_app/dags .
markers =
    unit: Pure unit tests zonder externe dependencies
    integration: Integratietests met synthetische data (MongoDB/Airflow)
    delft: Integratietests met echte Delftse data (DB034)
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning:flask_sqlalchemy
    ignore::DeprecationWarning:flask_appbuilder
    ignore::DeprecationWarning:flask_babel
    ignore:.*MovedIn20Warning.*:sqlalchemy.exc.MovedIn20Warning
    ignore::DeprecationWarning:marshmallow_sqlalchemy
