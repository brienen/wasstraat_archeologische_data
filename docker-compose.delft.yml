services:
  postgres:
    container_name: "wasstraat_postgres"
    image: wasstraat_postgres
    env_file:
       - ./config/postgres.env
       - ./config/flask.env
    environment:
      # Datamap van PostgreSQL. Moet gelijk zijn aan het pad van het volume hieronder,
      # anders staat de database in de container zelf en verdwijnt die bij opnieuw aanmaken.
      PGDATA: /data/postgres
    ports:
      - "5432:5432"
    volumes:
      - wasstraat_postgres_volume:/data/postgres
      - ./data/delft/backup/postgres:/backup
    build:
      dockerfile: ./services/postgres/Dockerfile
      context: .
    restart: unless-stopped

  airflow:
    container_name: "wasstraat_airflow"
    image: wasstraat_airflow
    env_file:
       - ./config/airflow.env
       - ./config/airflow_db.env
       - ./config/mongo.env
       - ./config/postgres.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongo
      - elasticsearch
    environment:
      WASSTRAAT_GEMEENTE: delft
      # Versie in het verwerkingsrapport; make delft geeft die mee uit config/version.env
      # (anders config/version.env.example)
      WASSTRAAT_VERSION: ${WASSTRAAT_VERSION:-}
    volumes:
       - ./data/delft/data/projecten:/input/projecten
       - ./data/delft/data/projecten:/input/images
       - ./data/delft/data/rapporten:/input/rapporten
       - ./data/delft/data/monsterdatabase:/input/monsterdatabase
       - ./data/delft/data/projectenlijst:/input/projectenlijst
       - ./data/delft/data/magazijnlijst:/input/magazijnlijst
       - ./data/delft/data/fotolijst:/input/fotolijst
       - ./data/delft/data/referentietabellen:/input/referentietabellen
       - ./data/delft/output/archeomedia:/output/archeomedia
       # Verwerkingsrapporten per run (AIRFLOW_OUTPUT_RAPPORTEN, issue 62)
       - ./data/delft/output/rapporten:/output/rapporten
       - ./data/delft/wasstraat_config:/opt/airflow/config
       - ./airflow_app/dags:/opt/airflow/dags # Deze niet aanpassen
       - ./airflow_app/scripts:/opt/airflow/scripts # Deze niet aanpassen
       - ./airflow_app/.vscode:/opt/airflow/.vscode
       - ./shared:/opt/airflow/dags/shared/ # Deze niet aanpassen
    build:
      dockerfile: ./services/airflow/Dockerfile
      context: .

  redis:
    image: redis:7.2-alpine
    container_name: "wasstraat_redis"
    ports:
      - '6379:6379'
    env_file:
      - ./config/redis.env
    command: >
      sh -c "redis-server --requirepass $$REDIS_PASSWORD"


# Computation
  flask:
    container_name: "wasstraat_flask"
    image: wasstraat_flask
    build:
      dockerfile: ./services/flask/Dockerfile
      context: .
    env_file:
      - ./config/flask.env
      - ./config/postgres.env
      - ./config/mongo.env
      - ./config/redis.env
    # Geen hostpoort: de webapplicatie is bereikbaar via Apache (poort 5052), dat alle
    # verzoeken behalve /archeomedia doorstuurt naar flask:5051. Voor debuggen geeft
    # docker-compose.develop.yml Flask wel een hostpoort.
    depends_on:
      - postgres
      - mongo
      - redis
      - elasticsearch
    volumes:
      - ./data/delft/output/archeomedia:/output/archeomedia


  mongo:
    image: mongo:7.0
    container_name: "wasstraat_mongo"
    ports:
      - '27017:27017'
    env_file:
      - ./config/mongo.env
    volumes:
      - wasstraat_mongo_volume:/data/db
      - wasstraat_mongo_config_volume:/data/configdb
      - ./data/delft/backup/mongo:/backup

  jupyter:
    container_name: wasstraat_jupyter
    build:
      dockerfile: ./services/jupyter/Dockerfile
      context: .
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/
      - ./data/delft/wasstraat_config:/home/jovyan/wasstraat_config/
      - ./airflow_app/dags:/opt/wasstraat/
      - ./shared:/home/jovyan/shared/
      - ./data/delft/data:/home/jovyan/basefiles
      - ./data/delft/data/projecten:/input/images
      - ./data/delft/data/referentietabellen:/input/referentietabellen
      - ./data/delft/output/archeomedia:/output/archeomedia
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    # Inloggen met het token uit config/jupyter.env (JUPYTER_PASSWORD)
    command: ["bash", "-c", "exec start-notebook.py --IdentityProvider.token=\"$$JUPYTER_PASSWORD\""]
    env_file:
       - ./config/jupyter.env
       - ./config/airflow.env
       - ./config/airflow_db.env
       - ./config/mongo.env
       - ./config/postgres.env

  # Voordeur van de Wasstraat: serveert /archeomedia uit de uitvoermap en stuurt al het
  # overige door naar Flask (reverse proxy, zie services/apache/httpd.conf)
  apache:
    container_name: wasstraat_apache
    build:
      dockerfile: ./services/apache/Dockerfile
      context: .
    depends_on:
      - flask
    volumes:
      - ./data/delft/output:/usr/local/apache2/htdocs:ro
    ports:
      - '5052:5052'


# docker pull docker.elastic.co/elasticsearch/elasticsearch:8.17.0
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: wasstraat_elasticsearch
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS= -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
      - 9300:9300


volumes:
    wasstraat_postgres_volume:
    wasstraat_mongo_volume:
    wasstraat_mongo_config_volume:
    elasticsearch-data:
      #driver: local
