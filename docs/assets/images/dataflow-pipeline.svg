<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1200" viewBox="0 0 1180 1200" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Verwerkingspipeline: de volledige cyclus">
<title>Verwerkingspipeline: de volledige cyclus</title>
<defs>
<marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5656"/></marker>
<marker id="pijlbegin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5656"/></marker>
</defs>
<rect x="0" y="0" width="1180" height="1200" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#1c2833">Verwerkingspipeline: de volledige cyclus</text>
<text x="24" y="56" text-anchor="start" font-size="12" fill="#283747">DAG Extract_Transform_Load_Full_Cycle; de incrementele cyclus volgt dezelfde stappen voor alleen de gewijzigde bronbestanden.</text>
<rect x="380" y="104" width="420" height="64" rx="8" ry="8" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.6"/>
<text x="390" y="124" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">0  Start_Run</text>
<text x="390" y="141" text-anchor="start" font-size="11.5" fill="#283747">run-document aanmaken (soort volledig);</text>
<text x="390" y="156" text-anchor="start" font-size="11.5" fill="#283747">faalt als er al een run actief is</text>
<rect x="380" y="186" width="420" height="64" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="390" y="206" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">1  Drop_All_Databases</text>
<text x="390" y="223" text-anchor="start" font-size="11.5" fill="#283747">MongoDB legen, behalve Verwerkingsruns</text>
<polyline points="590.0,168 590.0,186" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="380" y="268" width="420" height="64" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="390" y="288" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">2  Extract_Group</text>
<text x="390" y="305" text-anchor="start" font-size="11.5" fill="#283747">importMDB.sh per invoermap, ABR en extra projecten,</text>
<text x="390" y="320" text-anchor="start" font-size="11.5" fill="#283747">afbeeldingen; Controleer_Databases en _Afbeeldingen</text>
<polyline points="590.0,250 590.0,268" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="380" y="350" width="420" height="64" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="390" y="370" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">3  Transform 1: harmoniseren</text>
<text x="390" y="387" text-anchor="start" font-size="11.5" fill="#283747">FixProjectNames, Harmonize_&lt;soort&gt;,</text>
<text x="390" y="402" text-anchor="start" font-size="11.5" fill="#283747">ParseFotobestanden</text>
<polyline points="590.0,332 590.0,350" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="380" y="432" width="420" height="64" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="390" y="452" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">4  Transform 2: attributen</text>
<text x="390" y="469" text-anchor="start" font-size="11.5" fill="#283747">Enhance_All_Attributes (gemeenteprofiel),</text>
<text x="390" y="484" text-anchor="start" font-size="11.5" fill="#283747">extract_Imagedata_From_FileNames</text>
<polyline points="590.0,414 590.0,432" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="380" y="514" width="420" height="64" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="390" y="534" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">5  Transform 3: sleutels</text>
<text x="390" y="551" text-anchor="start" font-size="11.5" fill="#283747">Set_ReferenceKeys_&lt;soort&gt;: key, key_&lt;soort&gt;</text>
<polyline points="590.0,496 590.0,514" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="380" y="596" width="420" height="64" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="390" y="616" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">6  Transform 5: verplaatsen en samenvoegen</text>
<text x="390" y="633" text-anchor="start" font-size="11.5" fill="#283747">Move_&lt;soort&gt;, Merge_&lt;soort&gt;, MergeFotoinfo,</text>
<text x="390" y="648" text-anchor="start" font-size="11.5" fill="#283747">Generate_Missing_&lt;soort&gt;</text>
<polyline points="590.0,578 590.0,596" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="380" y="678" width="420" height="64" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="390" y="698" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">7  Transform 4: primary_keys en verwijzingen</text>
<text x="390" y="715" text-anchor="start" font-size="11.5" fill="#283747">Set_PrimaryKey_&lt;soort&gt; (stabiel),</text>
<text x="390" y="730" text-anchor="start" font-size="11.5" fill="#283747">Set_Reference_&lt;soort&gt;</text>
<polyline points="590.0,660 590.0,678" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="380" y="760" width="420" height="64" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="390" y="780" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">8  Laden en indexeren</text>
<text x="390" y="797" text-anchor="start" font-size="11.5" fill="#283747">LoadToDatabase_postgres (atomic swap),</text>
<text x="390" y="812" text-anchor="start" font-size="11.5" fill="#283747">Index_&lt;tabel&gt;, Index_Klaar (all_done)</text>
<polyline points="590.0,742 590.0,760" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="380" y="842" width="420" height="64" rx="8" ry="8" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.6"/>
<text x="390" y="862" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">9  Registreer_Bronbestanden</text>
<text x="390" y="879" text-anchor="start" font-size="11.5" fill="#283747">vingerafdrukken vastleggen, run afgerond</text>
<polyline points="590.0,824 590.0,842" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="380" y="924" width="420" height="64" rx="8" ry="8" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.6"/>
<text x="390" y="944" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">10  Verwerkingsrapport</text>
<text x="390" y="961" text-anchor="start" font-size="11.5" fill="#283747">all_done, ook na een fout; daarna</text>
<text x="390" y="976" text-anchor="start" font-size="11.5" fill="#283747">End_ETL_full_cycle (status van de DAG)</text>
<polyline points="590.0,906 590.0,924" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="20" y="70" width="300" height="730" rx="12" ry="12" fill="#fef9e7" fill-opacity="0.55" stroke="#9a7d0a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="32" y="88" font-size="12.5" font-weight="bold" fill="#9a7d0a">Invoer en configuratie</text>
<rect x="36" y="272.0" width="268" height="56" rx="8" ry="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.6"/>
<text x="170.0" y="292.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Invoermappen  /input</text>
<text x="170.0" y="309.0" text-anchor="middle" font-size="11.5" fill="#283747">Access-databases, Excel, afbeeldingen</text>
<polyline points="304,300.0 380,300.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="36" y="354.0" width="268" height="56" rx="8" ry="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.6"/>
<text x="170.0" y="374.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Harmonisatie-Excel</text>
<text x="170.0" y="391.0" text-anchor="middle" font-size="11.5" fill="#283747">tabellen en kolommen per soort</text>
<polyline points="304,382.0 380,382.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="36" y="436.0" width="268" height="56" rx="8" ry="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.6"/>
<text x="170.0" y="456.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Gemeenteprofiel</text>
<text x="170.0" y="473.0" text-anchor="middle" font-size="11.5" fill="#283747">WASSTRAAT_GEMEENTE</text>
<polyline points="304,464.0 380,464.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="36" y="600.0" width="268" height="66" rx="8" ry="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.6"/>
<text x="170.0" y="620.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">correcties.yml</text>
<text x="170.0" y="637.0" text-anchor="middle" font-size="11.5" fill="#283747">paden_overslaan, brondata_ en projectcode_,</text>
<text x="170.0" y="652.0" text-anchor="middle" font-size="11.5" fill="#283747">artefact_niet_mergen, rapportcode_prefixen</text>
<polyline points="304,628.0 380,628.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="36" y="706.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#283747">correcties.yml werkt in stap 2</text>
<text x="36" y="720.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#283747">(paden_overslaan, rapportcode_prefixen),</text>
<text x="36" y="734.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#283747">3 (brondata_correcties, rapportcode_prefixen),</text>
<text x="36" y="748.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#283747">4 (projectcode_correcties) en 6 (artefact_niet_mergen)</text>
<rect x="860" y="70" width="300" height="944" rx="12" ry="12" fill="#fdf2e9" fill-opacity="0.55" stroke="#ba4a00" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="872" y="88" font-size="12.5" font-weight="bold" fill="#ba4a00">Gegevens</text>
<rect x="876" y="106.0" width="268" height="60" rx="8" ry="8" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.6"/>
<text x="1010.0" y="126.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Verwerkingsruns</text>
<text x="1010.0" y="143.0" text-anchor="middle" font-size="11.5" fill="#283747">run-document, meldingen, tellingen</text>
<polyline points="800,136.0 876,136.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="876" y="270.0" width="268" height="60" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="1010.0" y="290.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Staging en mediamap</text>
<text x="1010.0" y="307.0" text-anchor="middle" font-size="11.5" fill="#283747">Arch_Staging, Filenames, Plaatjes,</text>
<text x="1010.0" y="322.0" text-anchor="middle" font-size="11.5" fill="#283747">output/archeomedia</text>
<polyline points="800,300.0 876,300.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="876" y="352.0" width="268" height="60" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="1010.0" y="372.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Single_Store</text>
<text x="1010.0" y="389.0" text-anchor="middle" font-size="11.5" fill="#283747">geharmoniseerd door Transform 1,</text>
<text x="1010.0" y="404.0" text-anchor="middle" font-size="11.5" fill="#283747">aangevuld door Transform 2 en 3</text>
<polyline points="800,382.0 876,382.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="876" y="598.0" width="268" height="60" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="1010.0" y="618.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Single_Store_Clean</text>
<text x="1010.0" y="635.0" text-anchor="middle" font-size="11.5" fill="#283747">verplaatst en samengevoegd,</text>
<text x="1010.0" y="650.0" text-anchor="middle" font-size="11.5" fill="#283747">met key, ID en verwijzingen</text>
<polyline points="800,628.0 876,628.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="876" y="762.0" width="268" height="60" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="1010.0" y="782.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">PostgreSQL en Elasticsearch</text>
<text x="1010.0" y="799.0" text-anchor="middle" font-size="11.5" fill="#283747">Def_-tabellen (gebruikersdata blijft),</text>
<text x="1010.0" y="814.0" text-anchor="middle" font-size="11.5" fill="#283747">afgeleide velden, index per tabel</text>
<polyline points="800,792.0 876,792.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="876" y="844.0" width="268" height="60" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="1010.0" y="864.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Def_Bronbestand</text>
<text x="1010.0" y="881.0" text-anchor="middle" font-size="11.5" fill="#283747">registratie voor de incrementele cyclus</text>
<polyline points="800,874.0 876,874.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<rect x="876" y="926.0" width="268" height="60" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="1010.0" y="946.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">output/rapporten</text>
<text x="1010.0" y="963.0" text-anchor="middle" font-size="11.5" fill="#283747">verwerkingsrapport (JSON en Markdown)</text>
<polyline points="800,956.0 876,956.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<polyline points="1010,762.0 1010,718.0 804,718.0" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="1000" y="734.0" text-anchor="end" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">bestaande primary_keys</text>
<rect x="20" y="1010" width="820" height="108" rx="8" ry="8" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.6"/>
<text x="30" y="1030" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">Foutbeleid</text>
<text x="30" y="1047" text-anchor="start" font-size="11.5" fill="#283747">Markeer_Run_Mislukt (trigger_rule one_failed) bewaakt alle taken behalve de Index-taken: een cruciale fout zet de run op mislukt.</text>
<text x="30" y="1062" text-anchor="start" font-size="11.5" fill="#283747">Waarschuwingen (onleesbare database, mislukte afbeelding, verwerkingsfout, mislukte index) komen in het run-document;</text>
<text x="30" y="1077" text-anchor="start" font-size="11.5" fill="#283747">boven de drempels AIRFLOW_MAX_* worden ze cruciaal. Elke taak meldt zijn fout via on_failure_callback.</text>
<text x="30" y="1092" text-anchor="start" font-size="11.5" fill="#283747">Het verwerkingsrapport draait altijd als laatste en vat de run samen.</text>
<rect x="20" y="1130" width="1140" height="66" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="30" y="1150" text-anchor="start" font-size="13" font-weight="bold" fill="#1c2833">Incrementele cyclus (Extract_Transform_Load_Incremental)</text>
<text x="30" y="1167" text-anchor="start" font-size="11.5" fill="#283747">Start_Run, Bepaal_Delta, Opruimen_Oude_Records, Extract (delta), Transform 1, 2, 3, 5 en 4 (delta), Load_Upsert, Index_&lt;tabel&gt;, Index_Klaar, Registreer_Run, Verwerkingsrapport</text>
</svg>
