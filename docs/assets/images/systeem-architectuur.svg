<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Systeemarchitectuur van de Wasstraat">
<title>Systeemarchitectuur van de Wasstraat</title>
<defs>
<marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5656"/></marker>
<marker id="pijlbegin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5656"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#1c2833">Systeemarchitectuur van de Wasstraat</text>
<rect x="330" y="62" width="300" height="46" rx="8" ry="8" fill="#f4f6f7" stroke="#566573" stroke-width="1.6"/>
<text x="480.0" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Beheerder</text>
<text x="480.0" y="99" text-anchor="middle" font-size="11.5" fill="#283747">Airflow-webinterface, poort 8080</text>
<rect x="820" y="62" width="300" height="46" rx="8" ry="8" fill="#f4f6f7" stroke="#566573" stroke-width="1.6"/>
<text x="970.0" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Gebruiker (browser)</text>
<text x="970.0" y="99" text-anchor="middle" font-size="11.5" fill="#283747">webapplicatie, poort 5052</text>
<rect x="20" y="140" width="260" height="510" rx="12" ry="12" fill="#fef9e7" fill-opacity="0.55" stroke="#9a7d0a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="32" y="158" font-size="12.5" font-weight="bold" fill="#9a7d0a">Host (mappen en bestanden)</text>
<rect x="36" y="172" width="228" height="80" rx="8" ry="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.6"/>
<text x="150.0" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Brondata  /input</text>
<text x="150.0" y="209" text-anchor="middle" font-size="11.5" fill="#283747">Access-databases, Excel,</text>
<text x="150.0" y="224" text-anchor="middle" font-size="11.5" fill="#283747">foto's, tekeningen, rapporten</text>
<text x="150.0" y="239" text-anchor="middle" font-size="11.5" fill="#283747">(alleen gelezen)</text>
<rect x="36" y="268" width="228" height="64" rx="8" ry="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.6"/>
<text x="150.0" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">wasstraat_config/</text>
<text x="150.0" y="305" text-anchor="middle" font-size="11.5" fill="#283747">harmonisatie-Excel</text>
<text x="150.0" y="320" text-anchor="middle" font-size="11.5" fill="#283747">correcties.yml</text>
<rect x="36" y="348" width="228" height="64" rx="8" ry="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.6"/>
<text x="150.0" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">config/*.env</text>
<text x="150.0" y="385" text-anchor="middle" font-size="11.5" fill="#283747">instellingen en wachtwoorden</text>
<text x="150.0" y="400" text-anchor="middle" font-size="11.5" fill="#283747">(init-config.sh)</text>
<rect x="36" y="428" width="228" height="64" rx="8" ry="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.6"/>
<text x="150.0" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Backupmap</text>
<text x="150.0" y="465" text-anchor="middle" font-size="11.5" fill="#283747">make backup: pg_dump</text>
<text x="150.0" y="480" text-anchor="middle" font-size="11.5" fill="#283747">en mongodump</text>
<rect x="36" y="540" width="228" height="90" rx="8" ry="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.6"/>
<text x="150.0" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Uitvoermap  /output</text>
<text x="150.0" y="577" text-anchor="middle" font-size="11.5" fill="#283747">archeomedia/: elk bestand in</text>
<text x="150.0" y="592" text-anchor="middle" font-size="11.5" fill="#283747">drie formaten</text>
<text x="150.0" y="607" text-anchor="middle" font-size="11.5" fill="#283747">rapporten/: verwerkingsrapporten</text>
<rect x="310" y="140" width="400" height="330" rx="12" ry="12" fill="#e9f7ef" fill-opacity="0.55" stroke="#1e8449" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="322" y="158" font-size="12.5" font-weight="bold" fill="#1e8449">Airflow 2.10.5  (wasstraat_airflow)</text>
<rect x="330" y="172" width="360" height="52" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="510.0" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Extractie</text>
<text x="510.0" y="209" text-anchor="middle" font-size="11.5" fill="#283747">importMDB.sh (mdbtools, mongoimport), afbeeldingen</text>
<rect x="330" y="236" width="360" height="52" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="510.0" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Transform 1 tot en met 5</text>
<text x="510.0" y="273" text-anchor="middle" font-size="11.5" fill="#283747">harmoniseren, attributen, sleutels, samenvoegen</text>
<rect x="330" y="300" width="360" height="52" rx="8" ry="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
<text x="510.0" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Laden en indexeren</text>
<text x="510.0" y="337" text-anchor="middle" font-size="11.5" fill="#283747">psycopg2 naar PostgreSQL, Elasticsearch per tabel</text>
<rect x="330" y="364" width="360" height="86" rx="8" ry="8" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.6"/>
<text x="510.0" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Run-document en foutbeleid</text>
<text x="510.0" y="401" text-anchor="middle" font-size="11.5" fill="#283747">Start_Run, Markeer_Run_Mislukt,</text>
<text x="510.0" y="416" text-anchor="middle" font-size="11.5" fill="#283747">Controleer_Databases, Controleer_Afbeeldingen,</text>
<text x="510.0" y="431" text-anchor="middle" font-size="11.5" fill="#283747">Verwerkingsrapport</text>
<rect x="780" y="140" width="380" height="330" rx="12" ry="12" fill="#eaf2fb" fill-opacity="0.55" stroke="#2471a3" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="792" y="158" font-size="12.5" font-weight="bold" fill="#2471a3">Webapplicatie</text>
<rect x="800" y="172" width="340" height="70" rx="8" ry="8" fill="#eaf2fb" stroke="#2471a3" stroke-width="1.6"/>
<text x="970.0" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Apache 2.4  (voordeur, poort 5052)</text>
<text x="970.0" y="209" text-anchor="middle" font-size="11.5" fill="#283747">/archeomedia: bestanden uit de uitvoermap</text>
<text x="970.0" y="224" text-anchor="middle" font-size="11.5" fill="#283747">al het overige: reverse proxy naar Flask</text>
<rect x="800" y="290" width="340" height="86" rx="8" ry="8" fill="#eaf2fb" stroke="#2471a3" stroke-width="1.6"/>
<text x="970.0" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Flask + Flask-AppBuilder</text>
<text x="970.0" y="327" text-anchor="middle" font-size="11.5" fill="#283747">gunicorn, poort 5051 (geen hostpoort)</text>
<text x="970.0" y="342" text-anchor="middle" font-size="11.5" fill="#283747">lijsten, kaart, zoeken, REST-API,</text>
<text x="970.0" y="357" text-anchor="middle" font-size="11.5" fill="#283747">bruiklenen en conservering invoeren</text>
<rect x="310" y="500" width="850" height="150" rx="12" ry="12" fill="#fdf2e9" fill-opacity="0.55" stroke="#ba4a00" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="322" y="518" font-size="12.5" font-weight="bold" fill="#ba4a00">Opslag</text>
<rect x="330" y="532" width="230" height="98" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="445.0" y="552" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">MongoDB 7.0</text>
<text x="445.0" y="569" text-anchor="middle" font-size="11.5" fill="#283747">Arch_Staging, Arch_Files,</text>
<text x="445.0" y="584" text-anchor="middle" font-size="11.5" fill="#283747">Arch_Analyse: Single_Store,</text>
<text x="445.0" y="599" text-anchor="middle" font-size="11.5" fill="#283747">Single_Store_Clean,</text>
<text x="445.0" y="614" text-anchor="middle" font-size="11.5" fill="#283747">Verwerkingsruns</text>
<rect x="580" y="532" width="230" height="98" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="695.0" y="552" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">PostgreSQL 18 + PostGIS 3.6</text>
<text x="695.0" y="569" text-anchor="middle" font-size="11.5" fill="#283747">database flask: Def_-tabellen,</text>
<text x="695.0" y="584" text-anchor="middle" font-size="11.5" fill="#283747">Def_Bronbestand</text>
<text x="695.0" y="599" text-anchor="middle" font-size="11.5" fill="#283747">database airflow: metadata</text>
<rect x="830" y="532" width="160" height="98" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="910.0" y="552" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Elasticsearch 8.17</text>
<text x="910.0" y="569" text-anchor="middle" font-size="11.5" fill="#283747">index per</text>
<text x="910.0" y="584" text-anchor="middle" font-size="11.5" fill="#283747">Def_-tabel</text>
<rect x="1010" y="532" width="130" height="98" rx="8" ry="8" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.6"/>
<text x="1075.0" y="552" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Redis 7.2</text>
<text x="1075.0" y="569" text-anchor="middle" font-size="11.5" fill="#283747">cache van de</text>
<text x="1075.0" y="584" text-anchor="middle" font-size="11.5" fill="#283747">webapplicatie</text>
<polyline points="480,108 480,140" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="520" y="128" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">bedienen</text>
<polyline points="970,108 970,172" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="1012" y="132" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">HTTP :5052</text>
<polyline points="264,212 330,198" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="296" y="196" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">lezen</text>
<polyline points="264,300 330,262" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="300" y="270" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">lezen</text>
<polyline points="264,380 310,380" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<polyline points="330,440 296,440 296,585 264,585" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="292" y="520" text-anchor="end" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">schrijven</text>
<polyline points="970,242 970,290" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="1000" y="270" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">proxy</text>
<polyline points="1140,207 1178,207 1178,668 150,668 150,630" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="700" y="662" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">Apache leest /archeomedia uit de uitvoermap (alleen-lezen)</text>
<polyline points="420,470 420,532" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="432" y="492" text-anchor="start" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">staging, transformatie</text>
<polyline points="600,470 660,532" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<polyline points="660,470 880,532" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="812" y="492" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">laden en indexeren</text>
<polyline points="860,376 860,440 760,440 760,532" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="812" y="433" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4d5656" stroke="#ffffff" stroke-width="3" paint-order="stroke">lezen en schrijven</text>
<polyline points="930,376 930,532" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<polyline points="1075,376 1075,532" fill="none" stroke="#4d5656" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="24" y="700" text-anchor="start" font-size="12" font-weight="bold" fill="#283747">Legenda</text>
<rect x="24" y="712" width="22" height="13" rx="3" fill="#fef9e7" stroke="#9a7d0a" stroke-width="1.4"/>
<text x="54" y="723" text-anchor="start" font-size="11" fill="#283747">mappen op de host</text>
<rect x="24" y="732" width="22" height="13" rx="3" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.4"/>
<text x="54" y="743" text-anchor="start" font-size="11" fill="#283747">verwerking (Airflow)</text>
<rect x="24" y="752" width="22" height="13" rx="3" fill="#eaf2fb" stroke="#2471a3" stroke-width="1.4"/>
<text x="54" y="763" text-anchor="start" font-size="11" fill="#283747">webapplicatie</text>
<rect x="24" y="772" width="22" height="13" rx="3" fill="#fdf2e9" stroke="#ba4a00" stroke-width="1.4"/>
<text x="54" y="783" text-anchor="start" font-size="11" fill="#283747">opslag</text>
<rect x="220" y="712" width="22" height="13" rx="3" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.4"/>
<text x="250" y="723" text-anchor="start" font-size="11" fill="#283747">run-document en foutbeleid</text>
<rect x="220" y="732" width="22" height="13" rx="3" fill="#f4f6f7" stroke="#566573" stroke-width="1.4"/>
<text x="250" y="743" text-anchor="start" font-size="11" fill="#283747">gebruikers</text>
<text x="470" y="712" text-anchor="start" font-size="11" fill="#283747">Alleen Apache (5052) en Airflow (8080) hoeven van buiten bereikbaar te zijn. Flask, Elasticsearch</text>
<text x="470" y="728" text-anchor="start" font-size="11" fill="#283747">en Redis hebben in de live installatie geen hostpoort; PostgreSQL en MongoDB luisteren daar</text>
<text x="470" y="744" text-anchor="start" font-size="11" fill="#283747">standaard alleen op 127.0.0.1. Flask schrijft gekantelde foto's terug in archeomedia/.</text>
<text x="470" y="760" text-anchor="start" font-size="11" fill="#283747">In de ontwikkelomgeving draait daarnaast Jupyter Lab (poort 8888) voor analyses.</text>
</svg>
