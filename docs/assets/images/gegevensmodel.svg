<text x="760.0" y="412" text-anchor="middle" font-size="11.5" fill="#283747">projectID, putID, vondstID, doosID</text>
<rect x="900" y="360" width="200" height="70" rx="4" ry="4" fill="#eaf2fb" stroke="#2471a3" stroke-width="1.6"/>
<text x="1000.0" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1c2833">Def_Monster_Botanie</text>
