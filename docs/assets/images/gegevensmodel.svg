<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Gegevensmodel in PostgreSQL (database flask)">
<title>Gegevensmodel in PostgreSQL (database flask)</title>
<defs>
<marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5656"/></marker>
<marker id="pijlbegin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5656"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="910" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#1c2833">Gegevensmodel in PostgreSQL (database flask)</text>
<rect x="40" y="62" width="1320" height="46" rx="4" ry="4" fill="#eaf2fb" stroke="#2471a3" stroke-width="1.6"/>
<text x="700.0" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2833">Def_Project</text>
<text x="700.0" y="99" text-anchor="middle" font-size="11.5" fill="#283747">projectcode, naam, jaar, locatie (PostGIS), aantal_artefacten; vrijwel elke tabel verwijst ernaar met projectID</text>
<rect x="180" y="150" width="200" height="58" rx="4" ry="4" fill="#eaf2fb" stroke="#2471a3" stroke-width="1.6"/>
<text x="280.0" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1c2833">Def_Vindplaats</text>
<text x="280.0" y="187" text-anchor="middle" font-size="11.5" fill="#283747">projectcd als tekst</text>
<rect x="420" y="150" width="200" height="58" rx="4" ry="4" fill="#eaf2fb" stroke="#2471a3" stroke-width="1.6"/>
<text x="520.0" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1c2833">Def_Put</text>
<text x="520.0" y="187" text-anchor="middle" font-size="11.5" fill="#283747">projectID</text>
