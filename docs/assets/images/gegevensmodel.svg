<rect x="660" y="735" width="200" height="58" rx="4" ry="4" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.6"/>
<text x="760.0" y="755" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1c2833">Def_Conserveringsproject</text>
<text x="760.0" y="772" text-anchor="middle" font-size="11.5" fill="#283747">uitvoerderID</text>
