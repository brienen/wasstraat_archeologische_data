<text x="1000.0" y="772" text-anchor="middle" font-size="11.5" fill="#283747">conservering_id, artefact_id;</text>
<text x="1000.0" y="787" text-anchor="middle" font-size="11.5" fill="#283747">markering artefact_verdwenen_*</text>
<rect x="1150" y="735" width="200" height="70" rx="4" ry="4" fill="#fbf7fc" stroke="#7d3c98" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1250.0" y="755" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1c2833">Def_artefact_abr</text>
<text x="1250.0" y="772" text-anchor="middle" font-size="11.5" fill="#283747">artefact_id, abr_materiaal_id</text>
<text x="1250.0" y="787" text-anchor="middle" font-size="11.5" fill="#283747">(extra ABR-materialen)</text>
