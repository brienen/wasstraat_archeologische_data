<text x="860" y="847" text-anchor="start" font-size="11" fill="#283747">Pijl: verwijzing (foreign key) naar de tabel waar de pijl naar wijst.</text>
<text x="40" y="872" text-anchor="start" font-size="11" fill="#283747">Verwijzingen naar Def_Project en Def_Put en vanuit de gebruikerstabellen naar Def_Artefact, Def_Project en Def_ABR staan als kolomnaam in de kaders.</text>
<text x="40" y="888" text-anchor="start" font-size="11" fill="#283747">Verdwijnt zo'n rij uit de brondata, dan wordt de verwijzing losgekoppeld met een markering; koppelrijen van Def_artefact_abr worden verwijderd.</text>
