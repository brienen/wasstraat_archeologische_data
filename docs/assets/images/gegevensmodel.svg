<text x="1250.0" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1c2833">Def_Bronbestand</text>
<text x="1250.0" y="187" text-anchor="middle" font-size="11.5" fill="#283747">registratie van bronbestanden</text>
