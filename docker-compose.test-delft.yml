# docker-compose.test-delft.yml
# Override voor integratietests met echte Delftse data (DB034).
# Vervangt de synthetische data volumes uit docker-compose.test.yml.
#
# Gebruik: make integration-delft

services:
  airflow-test:
    volumes:
      - ./airflow_app/dags:/opt/airflow/dags
      - ./airflow_app/scripts:/opt/airflow/scripts
      - ./shared:/opt/airflow/dags/shared
      - ./data/wasstraat_config:/opt/airflow/config
      - ./data/test/projecten:/input/projecten:ro
      - ./data/test/projecten:/input/images:ro
      - ./data/test/projectenlijst:/input/delfit:ro
      - ./data/test/referentietabellen:/input/referentietabellen:ro
