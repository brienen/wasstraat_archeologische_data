# docker-compose.test-delft.yml
# Override voor integratietests met echte Delftse data.
# Vervangt de synthetische data volumes uit docker-compose.test.yml.
#
# Gebruik: make integration-delft

services:
  airflow-test:
    volumes:
      - ./airflow_app/dags:/opt/airflow/dags
      - ./airflow_app/scripts:/opt/airflow/scripts
      - ./shared:/opt/airflow/dags/shared
      - ./data/delft/wasstraat_config:/opt/airflow/config
      - ./data/delft/data/digidepot:/input/projecten:ro
      - ./data/delft/data/digidepot:/input/images:ro
      - ./data/delft/data/Delf-IT:/input/delfit:ro
      - ./data/delft/data/referentietabellen:/input/referentietabellen:ro
