# Correcties voor Delftse testdata (DB034)
#
# Minimale configuratie: alleen rapportcode-prefixen nodig voor
# herkenning van DAR/DAN-bestanden in data/test/data/rapporten/.

# Geen projectcode-correcties nodig — DB034 is consistent.
# projectcode_correcties: []

# Geen brondata-correcties nodig.
