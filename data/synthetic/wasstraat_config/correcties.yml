# Correcties voor synthetische testdata
#
# Bevat testgevallen om te valideren dat het correctiemechanisme werkt.

# Projectcode-correcties: pas toe op het projectcd veld in Single_Store na harmonisatie.
# Elke regel: als projectcd matcht op het regex-patroon, vervang door projectcode.
projectcode_correcties:
  - patroon: "SYNTFOUT"
    projectcode: "SY001"

# Brondata-correcties: pas toe op raw velden in staging-collecties vóór harmonisatie.
# Nodig als brondata afwijkende projectcodes bevat die niet matchen met de projectenlijst.
brondata_correcties:
  - collectie: COLL_STAGING_MONSTER
    veld: PROJECT
    patroon: "SYNTFOUT"
    waarde: "SY001"

# Projecten waarvan artefacten niet gemerged mogen worden
#artefact_niet_mergen:
#  projectcodes: ["DC112"]

# Paden die de extractie overslaat (issue 84): glob-patronen relatief aan de invoermap (de projectmap,
# in de testomgeving ook de map met afbeeldingen), hoofdletterongevoelig; een patroon dat een map
# aanwijst geldt voor alles daaronder. De werkmap van SY001 bevat een kopie van de database en van een
# foto; de integratietest controleert dat die worden overgeslagen en de aantallen niet veranderen.
paden_overslaan:
  - "SY001/K Overig/werkmap"

