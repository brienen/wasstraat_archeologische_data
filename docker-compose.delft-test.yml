# docker-compose.delft-test.yml
# Test-omgeving voor Delftse testdata (DB034 project uit data/test/).
#
# Structureel identiek aan docker-compose.test.yml, maar mount data/test/
# in plaats van data/synthetic/. Hierdoor draaien de Delft-integratietests
# in dezelfde geïsoleerde omgeving als de synthetische tests.
#
# Gebruik: make integration-delft

services:
  mongo-test:
    image: mongo:7.0
    container_name: "wasstraat_mongo_delft_test"
    ports:
      - "27117:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: testroot
      MONGO_INITDB_ROOT_PASSWORD: testpass
    networks:
      testnet-delft:
        aliases:
          - mongo
    tmpfs:
      - /data/db

  redis-test:
    image: redis:7.2-alpine
    container_name: "wasstraat_redis_delft_test"
    networks:
      testnet-delft:
        aliases:
          - redis

  postgres-test:
    build:
      context: .
      dockerfile: services/postgres/Dockerfile
    container_name: "wasstraat_postgres_delft_test"
    environment:
      POSTGRES_DB: airflow_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      FLASK_PGUSER: testuser
      FLASK_PGPASSWORD: testpass
      FLASK_PGDATABASE: airflow_test
      PGDATA: /data/postgres
      PASSWORD_AUTHENTICATION: md5
    networks:
      testnet-delft:
        aliases:
          - postgres
    tmpfs:
      - /data/postgres

  airflow-test:
    build:
      context: .
      dockerfile: services/airflow/Dockerfile
    container_name: "wasstraat_airflow_delft_test"
    depends_on:
      - mongo-test
      - postgres-test
    ports:
      - "8082:8080"
    networks:
      - testnet-delft
    environment:
      # Airflow metadata
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "10"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://testuser:testpass@postgres:5432/airflow_test"
      DB__HOST: postgres
      DB__PORT: "5432"
      DB__USERNAME: testuser
      DB__PASSWORD: testpass
      DB__NAME: airflow_test
      PGPASSWORD: testpass
      SECURITY__ADMIN_USERNAME: admin
      SECURITY__ADMIN_PASSWORD: admin
      SECURITY__ADMIN_FIRSTNAME: Test
      SECURITY__ADMIN_LASTNAME: Admin
      SECURITY__ADMIN_EMAIL: test@test.nl
      # shared.config vereist deze drie, anders KeyError
      POSTGRES_DB: airflow_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      FLASK_PGUSER: testuser
      FLASK_PGPASSWORD: testpass
      FLASK_PGDATABASE: airflow_test
      # MongoDB
      MONGO_SERVER: mongo
      MONGO_INITDB_ROOT_USERNAME: testroot
      MONGO_INITDB_ROOT_PASSWORD: testpass
      DB_STAGING: Arch_Staging_Test
      DB_FILES: Arch_Files_Test
      DB_ANALYSE: Arch_Analyse_Test
      COLL_ANALYSE: Single_Store
      COLL_ANALYSE_CLEAN: Single_Store_Clean
      COLL_PLAATJES: Plaatjes
      COLL_FILENAMES: Filenames
      COLL_STAGING_METAINFO: Kolominformatie
      COLL_STAGING_OUD: Staging_Projecten_Oud
      COLL_STAGING_NIEUW: Staging_Projecten_Nieuw
      COLL_STAGING_MAGAZIJNLIJST: Staging_Projecten_Magazijnlijst
      COLL_STAGING_PROJECTENLIJST: Staging_Projecten_Projectenlijst
      COLL_STAGING_FOTOLIJST: Staging_Projecten_Fotolijst
      COLL_STAGING_MONSTER: Staging_Projecten_Monster
      COLL_ANALYSE_FOTO: Def_Fotos
      COLL_ANALYSE_ARTEFACT: Def_Artefact
      COLL_ANALYSE_PROJECT: Def_Project
      COLL_ANALYSE_VONDST: Def_Vondst
      COLL_ANALYSE_SPOOR: Def_Spoor
      COLL_ANALYSE_VLAK: Def_Vlak
      COLL_ANALYSE_PUT: Def_Put
      COLL_ANALYSE_DOOS: Def_Doos
      COLL_ANALYSE_STANDPLAATS: Def_Standplaats
      COLL_ANALYSE_STELLING: Def_Stelling
      COLL_ANALYSE_PLAATSING: Def_Plaatsing
      COLL_ANALYSE_VINDPLAATS: Def_Vindplaats
      MONGO_MINPOOLSIZE: "10"
      # Paden
      AIRFLOW_TEMPDIR: /opt/airflow/tmp
      AIRFLOW_LOGDIR: /opt/airflow/logs
      AIRFLOW_WASSTRAAT_CONFIG: /opt/airflow/config/Wasstraat_Config_HarmonizeV3.xlsx
      AIRFLOW_INPUT_PROJECTEN: /input/projecten
      AIRFLOW_INPUT_IMAGES: /input/projecten
      AIRFLOW_INPUT_PROJECTENLIJST: /input/projectenlijst
      AIRFLOW_INPUT_MAGAZIJNLIJST: /input/magazijnlijst
      AIRFLOW_INPUT_FOTOLIJST: /input/fotolijst
      AIRFLOW_INPUT_MONSTER: /input/monsterdatabase
      AIRFLOW_INPUT_RAPPORTEN: /input/rapporten
      AIRFLOW_OUTPUT_MEDIA: /tmp/archeomedia_test
      ES_HOST: "http://localhost:9200"
    volumes:
      - ./airflow_app/dags:/opt/airflow/dags
      - ./airflow_app/scripts:/opt/airflow/scripts
      - ./shared:/opt/airflow/dags/shared
      - ./data/test/wasstraat_config:/opt/airflow/config
      - ./data/test/data/projecten:/input/projecten:ro
      - ./data/test/data/projectenlijst:/input/projectenlijst:ro
      - ./data/test/data/magazijnlijst:/input/magazijnlijst:ro
      - ./data/test/data/fotolijst:/input/fotolijst:ro
      - ./data/test/data/monsterdatabase:/input/monsterdatabase:ro
      - ./data/test/data/referentietabellen:/input/referentietabellen:ro
      - ./data/test/data/rapporten:/input/rapporten:ro

  flask-test:
    build:
      context: .
      dockerfile: services/flask/Dockerfile
    container_name: "wasstraat_flask_delft_test"
    depends_on:
      - postgres-test
      - redis-test
    ports:
      - "5062:5051"
    networks:
      - testnet-delft
    environment:
      POSTGRES_DB: airflow_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      FLASK_PGUSER: testuser
      FLASK_PGPASSWORD: testpass
      FLASK_PGDATABASE: airflow_test
      CACHE_REDIS_HOST: redis
      CACHE_REDIS_PASSWORD: ""
      REDIS_PASSWORD: ""
      CACHE_DEFAULT_TIMEOUT: "60"
      ES_HOST: ""
      SECRET_KEY: test-secret-key-voor-delft-tests
      MONGO_SERVER: mongo
      MONGO_INITDB_ROOT_USERNAME: testroot
      MONGO_INITDB_ROOT_PASSWORD: testpass
      DB_STAGING: Arch_Staging_Test
      DB_FILES: Arch_Files_Test
      DB_ANALYSE: Arch_Analyse_Test
      COLL_ANALYSE: Single_Store
      COLL_ANALYSE_CLEAN: Single_Store_Clean
      COLL_PLAATJES: Plaatjes
      COLL_FILENAMES: Filenames
      COLL_STAGING_METAINFO: Kolominformatie
      COLL_STAGING_OUD: Staging_Projecten_Oud
      COLL_STAGING_NIEUW: Staging_Projecten_Nieuw
      COLL_STAGING_MAGAZIJNLIJST: Staging_Projecten_Magazijnlijst
      COLL_STAGING_PROJECTENLIJST: Staging_Projecten_Projectenlijst
      COLL_STAGING_FOTOLIJST: Staging_Projecten_Fotolijst
      COLL_STAGING_MONSTER: Staging_Projecten_Monster
      COLL_ANALYSE_FOTO: Def_Fotos
      COLL_ANALYSE_ARTEFACT: Def_Artefact
      COLL_ANALYSE_PROJECT: Def_Project
      COLL_ANALYSE_VONDST: Def_Vondst
      COLL_ANALYSE_SPOOR: Def_Spoor
      COLL_ANALYSE_VLAK: Def_Vlak
      COLL_ANALYSE_PUT: Def_Put
      COLL_ANALYSE_DOOS: Def_Doos
      COLL_ANALYSE_STANDPLAATS: Def_Standplaats
      COLL_ANALYSE_STELLING: Def_Stelling
      COLL_ANALYSE_PLAATSING: Def_Plaatsing
      COLL_ANALYSE_VINDPLAATS: Def_Vindplaats

networks:
  testnet-delft:
    driver: bridge
